# Web app (web/): checks every pull request, and deploys oktan.ustunfatih.com on every push to main.
# The deploy only runs after typecheck and tests pass. Needs the repository secret CLOUDFLARE_API_TOKEN
# (Cloudflare API token from the "Edit Cloudflare Workers" template); the account id is in wrangler.jsonc.
name: Web deploy

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  # Manual run from the Actions tab, for a redeploy without a new commit.
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build
